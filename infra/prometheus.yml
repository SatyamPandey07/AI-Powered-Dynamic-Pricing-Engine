global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi_backend'
    metrics_path: '/metrics'
    static_configs:
      # Assume the backend runs on host port 8000
      - targets: ['host.docker.internal:8000']
