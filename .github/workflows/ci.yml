name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install poetry
          poetry install

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint and Format (Backend)
        run: |
          cd backend
          poetry run ruff check .
          poetry run black --check .

      - name: Lint and Format (Frontend)
        run: |
          cd frontend
          npm run lint || echo "No lint script yet"
          npx prettier --check . || echo "No prettier yet"

      - name: Run Tests (Backend)
        run: |
          cd backend
          poetry run pytest --cov=app tests/

      - name: Run Tests (Frontend)
        run: |
          cd frontend
          npm run test || echo "No vitest script yet"

  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t backend:latest ./backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Build Frontend Image
        run: docker build -t frontend:latest ./frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
