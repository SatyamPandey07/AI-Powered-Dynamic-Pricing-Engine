name: CI Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pricing_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/pricing_engine
      REDIS_URL: redis://localhost:6379/0
      ENCRYPTION_KEY: qQk-Oq2L4sC_Yy3mN7UeC8KzTq2F7UeC8KzTq2F7UeM=
      JWT_SECRET: supersecret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pytest-asyncio

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install

      - name: Run DB Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Tests (Backend)
        run: |
          cd backend
          pytest --cov=app --cov-report=xml

      - name: Run Tests (Frontend)
        run: |
          cd frontend
          npm run test || echo "No test script yet"

  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t backend:latest ./backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Build Frontend Image
        run: docker build -t frontend:latest ./frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
