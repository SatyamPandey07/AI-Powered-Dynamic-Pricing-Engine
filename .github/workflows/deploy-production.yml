name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          SHA_TAG=$(git rev-parse --short HEAD)
          
          docker build -t ghcr.io/${{ github.repository_owner }}/pricing-backend:$SHA_TAG ./backend
          docker build -t ghcr.io/${{ github.repository_owner }}/pricing-backend:latest ./backend
          
          docker build -t ghcr.io/${{ github.repository_owner }}/pricing-frontend:$SHA_TAG ./frontend
          docker build -t ghcr.io/${{ github.repository_owner }}/pricing-frontend:latest ./frontend
          
          docker push ghcr.io/${{ github.repository_owner }}/pricing-backend:$SHA_TAG
          docker push ghcr.io/${{ github.repository_owner }}/pricing-backend:latest
          
          docker push ghcr.io/${{ github.repository_owner }}/pricing-frontend:$SHA_TAG
          docker push ghcr.io/${{ github.repository_owner }}/pricing-frontend:latest

      - name: Run Database Migrations
        run: |
          echo "Running production database migrations..."
          # command to run migrations on prod DB

      - name: Deploy to Production
        run: |
          echo "Triggering deployment to production (e.g. Render Webhook)"
          # curl -X POST ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}

      - name: Smoke Tests
        run: |
          echo "Running smoke tests on production environment"
          # curl -f https://api.pricingengine.com/health || exit 1

      - name: Slack Notification
        if: always()
        run: |
          echo "Notifying Slack #deployments"
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployed to production: ${{ job.status }}"}' ${{ secrets.SLACK_WEBHOOK_URL }}
